<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>数学命题索引</title>
<meta name="description" content="本科数学教材中有讲解的定义、定理、命题与例的索引，只含陈述，便于随时自测。">
<link rel="stylesheet" href="vendor/katex/katex.min.css">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand">
      <div class="brand-title">数学命题索引</div>
      <div class="brand-sub">只含陈述 · 便于自测</div>
    </div>
    <div class="books" id="books"></div>
    <div class="search-box">
      <input id="search" type="search" placeholder="搜索命题、术语（/ 聚焦）" autocomplete="off">
    </div>
    <nav id="toc" aria-label="目录"></nav>
    <div class="side-foot">
      <a href="https://github.com/javaochen/fdu-math-indexes" target="_blank" rel="noopener">GitHub</a>
      <span class="dot">·</span>
      <button id="about-btn" class="linklike" type="button">说明</button>
    </div>
  </aside>

  <main id="main">
    <header id="topbar">
      <button id="menu-btn" class="icon-btn" type="button" aria-label="目录">☰</button>
      <div id="crumbs" class="crumbs"></div>
      <div class="modes" role="group" aria-label="显示模式">
        <button class="mode" data-mode="read" type="button">阅读</button>
        <button class="mode" data-mode="test" type="button">自测</button>
        <button class="mode" data-mode="random" type="button">随机</button>
      </div>
    </header>
    <div id="view"></div>
  </main>
</div>

<div id="modal" class="modal" hidden>
  <div class="modal-card">
    <button id="modal-close" class="modal-close" type="button" aria-label="关闭">×</button>
    <h2>关于本索引</h2>
    <p>收录本科数学教材正文中有讲解的定义、定理、命题、推论与例，只保留陈述，不含证明、不含习题与解答，并标注原书页码。</p>
    <p>目前收录：泛函分析（王凯）第一章 160 条、实变函数（2023）1.1 节 49 条。只收陈述，不写证明与习题；反例类只给问句，不附答案。内容由扫描页逐页提取并人工校对，可能存在识别错误；发现错误请在仓库提 issue。</p>
    <p>操作：<kbd>/</kbd> 搜索，<kbd>空格</kbd> 显示/隐藏，<kbd>←</kbd> <kbd>→</kbd> 切换条目，<kbd>r</kbd> 随机抽一条。</p>
    <p>页面不记录任何使用数据，也不保存进度。</p>
  </div>
</div>

<script src="vendor/katex/katex.min.js"></script>
<script src="vendor/katex/contrib/auto-render.min.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
